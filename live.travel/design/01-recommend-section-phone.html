<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>travel · 推荐 · 优胜美地 (Phone)</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #2b2b2b;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
  }

  /* ---- phone bezel, for preview only ---- */
  .phone {
    width: 360px;
    height: 640px;
    background: #000;
    border-radius: 28px;
    padding: 10px;
    box-shadow: 0 0 0 2px #444;
  }
  .screen {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    border-radius: 4px;
  }

  /* ---- WP status bar ---- */
  .statusbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 10px;
    color: #fff;
    font-size: 12px;
    font-weight: 400;
    z-index: 10;
    box-sizing: border-box;
  }

  /* ---- panoramic background scene (stand-in for real photography) ---- */
  .scene {
    position: absolute;
    top: 0; left: -15%;
    width: 130%;
    height: 100%;
    background: linear-gradient(180deg, #4a7fb5 0%, #7fa8c9 28%, #cfe0e8 46%, #e7ede4 52%);
  }
  .ridge {
    position: absolute;
    left: 0; right: 0;
    bottom: 0;
  }
  .ridge polygon { }

  /* ---- top small panorama title ---- */
  .app-title {
    position: absolute;
    top: 26px;
    left: 20px;
    color: #6fe3d6;
    font-size: 15px;
    font-weight: 300;
    letter-spacing: 1px;
    text-transform: lowercase;
    z-index: 5;
  }

  /* ---- section header = destination name ---- */
  .headline {
    position: absolute;
    top: 60px;
    left: 20px;
    right: 40px;
    z-index: 5;
  }
  .headline .en {
    font-size: 58px;
    font-weight: 200;
    color: #ffffff;
    line-height: 1;
    margin: 0;
    text-shadow: 0 1px 6px rgba(0,0,0,0.35);
  }
  .headline .cn {
    font-size: 17px;
    font-weight: 400;
    color: #6fe3d6;
    margin: 6px 0 0;
    letter-spacing: 2px;
  }

  /* ---- next-section peek hint at right edge ---- */
  .peek {
    position: absolute;
    top: 66px;
    right: -6px;
    font-size: 58px;
    font-weight: 200;
    color: rgba(255,255,255,0.18);
    z-index: 4;
    writing-mode: vertical-rl;
  }

  /* ---- cyan info band near bottom ---- */
  .info-band {
    position: absolute;
    left: 0; right: 0;
    bottom: 54px;
    background: #00B7C3;
    padding: 14px 20px 16px;
    box-sizing: border-box;
    z-index: 6;
  }
  .info-band .label {
    font-size: 12px;
    font-weight: 600;
    color: #04343a;
    letter-spacing: 1px;
    margin: 0 0 6px;
    text-transform: uppercase;
  }
  .info-band p {
    margin: 0;
    font-size: 13.5px;
    line-height: 1.55;
    color: #04343a;
  }
  .info-band .more {
    margin-top: 10px;
    font-size: 12.5px;
    font-weight: 600;
    color: #04343a;
  }

  /* ---- bottom app bar ---- */
  .appbar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 54px;
    background: #151515;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
    z-index: 7;
  }
  .appbar .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #999;
  }
  .appbar .icon {
    width: 22px; height: 22px;
    border: 1.5px solid #fff;
    border-radius: 50%;
    box-sizing: border-box;
    position: relative;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="screen">

    <div class="scene">
      <svg class="ridge" viewBox="0 0 400 300" preserveAspectRatio="none" width="100%" height="55%">
        <polygon points="0,300 0,150 60,90 120,160 180,70 230,150 280,100 340,170 400,110 400,300" fill="#6b7f6a"></polygon>
        <polygon points="0,300 0,210 80,160 150,220 220,150 300,215 400,170 400,300" fill="#3f5540"></polygon>
        <polygon points="0,300 0,260 100,235 220,270 320,240 400,265 400,300" fill="#26362a"></polygon>
      </svg>
    </div>

    <div class="statusbar">
      <span>10:24</span>
      <span>◣ ▮▮▮ 100%</span>
    </div>

    <div class="app-title">bing travel</div>

    <div class="headline">
      <p class="en">Yosemite</p>
      <p class="cn">优胜美地国家公园 · 加利福尼亚</p>
    </div>

    <div class="peek">行程</div>

    <div class="info-band">
      <p class="label">当地简介</p>
      <p>优胜美地国家公园位于美国加利福尼亚州内华达山脉西麓，以花岗岩峭壁、瀑布、清澈溪流与古老巨杉林著称，是徒步与自然摄影爱好者的圣地。</p>
      <p class="more">了解更多 ›</p>
    </div>

    <div class="appbar">
      <div class="icon"></div>
      <div class="icon"></div>
      <div class="icon"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

  </div>
</div>

</body>
</html>
